name: desengastando
description: "Desengastando — controle de gastos pessoal, simples e offline."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cupertino_icons: ^2.0.0
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  file_picker: ^13.4.0
  fl_chart: ^1.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  intl: ^0.20.2
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.8
  share_plus: ^13.3.1

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.35.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  riverpod_generator: ^4.0.10
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true

  assets:
    # Licença da fonte, exibida em Ajustes > Sobre > Licenças.
    - assets/fonts/manrope/OFL.txt

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/manrope/Manrope-Regular.ttf
        - asset: assets/fonts/manrope/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/manrope/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/manrope/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/manrope/Manrope-ExtraBold.ttf
          weight: 800

# Ícone e tela de abertura. PNGs gerados por tool/icon/render_icons_test.dart.
# Para regenerar:
#   flutter test tool/icon/render_icons_test.dart
#   dart run flutter_launcher_icons
#   dart run flutter_native_splash:create
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#0F766E"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  adaptive_icon_monochrome: assets/icon/icon_foreground.png
  min_sdk_android: 21

flutter_native_splash:
  color: "#F7F9F8"
  color_dark: "#0E1513"
  image: assets/icon/splash.png
  # Android 12+ recorta a imagem num círculo de 2/3 do tamanho; o disco do
  # splash.png (raio 0,36) preenche esse círculo. A cor de fundo do ícone
  # (icon_background_color) é ignorada em algumas versões, por isso o disco
  # vem desenhado na própria imagem.
  android_12:
    image: assets/icon/splash.png
    color: "#F7F9F8"
    color_dark: "#0E1513"
