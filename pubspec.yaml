name: desengastando
description: "Desengastando — controle de gastos pessoal, simples e offline."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  fl_chart: ^1.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  intl: ^0.20.2
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.8

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.35.3
  flutter_test:
    sdk: flutter
  riverpod_generator: ^4.0.10
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/manrope/Manrope-Regular.ttf
        - asset: assets/fonts/manrope/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/manrope/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/manrope/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/manrope/Manrope-ExtraBold.ttf
          weight: 800
