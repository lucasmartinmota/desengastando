include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    # Gerado por `drift_dev schema generate` (testes de migração).
    - "test/generated_migrations/**"

  errors:
    # App (não é pacote publicado): exigir docs em todo membro público é ruído.
    public_member_api_docs: ignore

linter:
  rules:
    lines_longer_than_80_chars: false
